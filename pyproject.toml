[project]
name = "algo-execution"
version = "0.1.0"
description = "Execution algos (TWAP, VWAP, POV, market making, pairs) with a backtester, TCA and a C++ exchange"
readme = "README.md"
authors = [{ name = "Abhiroop Yalavarthi" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# C++ exchange (pybind11 bindings to the order book). Needs a C++20 compiler.
cpp = ["algo-cpp"]
# FixExchange: trade through the C++ FIX gateway (fix-gateway repo). The quickfix
# package compiles from source on install, which takes a few minutes.
fix = ["quickfix>=1.16"]

[project.scripts]
algo = "algo.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.uv.sources]
algo-cpp = { path = "cpp" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["algo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
